spring.application.name=payledger

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/payledger}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-minimum-32-characters-long}
jwt.expiration-ms=3600000